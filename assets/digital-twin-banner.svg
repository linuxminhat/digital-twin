    <text x="26" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">AI DIGITAL TWIN</text>

    <rect x="142" y="0" width="145" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1.2"/>
    <circle cx="156" cy="14" r="4" fill="#c084fc"/>
    <text x="168" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">RAG ARCHITECTURE</text>

