name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check src evaluation tests
      - name: Format check
        run: ruff format --check src evaluation tests
      - name: Unit tests
        run: pytest
      - name: Validate knowledge base chunking
        run: python -m src.chunker knowledge-base/minh-primary-evidence.md

  benchmark:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Benchmark quality gate
        run: |
          python -m evaluation.eval_runner \
            --report benchmark_report.md --json benchmark_results.json \
            --min-recall 0.9 --min-rejection 1.0 --max-false-refusal 0.1
      - name: Publish summary
        if: always()
        run: cat benchmark_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: |
            benchmark_report.md
            benchmark_results.json

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (runs benchmark gate during build)
        run: docker build -t digital-twin:ci .
      - name: Smoke test
        run: docker run --rm digital-twin:ci --query "What is ITSmartHire?"
